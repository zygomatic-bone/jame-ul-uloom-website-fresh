name: Deploy Jame Ul Uloom to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Bayanath videos"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website (exclude PHP handlers)
        shell: bash
        run: |
          mkdir -p _site
          cp -a public/. _site/
          find _site -type f \( -iname '*.php' -o -iname '*.phtml' -o -iname '*.php[0-9]' \) -print -delete
          rm -f _site/.htaccess
          touch _site/.nojekyll
          test -f _site/index.html
          if find _site -type f \( -iname '*.php' -o -iname '*.phtml' \) | grep -q .; then
            echo "PHP files remain in the GitHub Pages artifact." >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
